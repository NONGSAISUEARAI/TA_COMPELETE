<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BU2-DE-26106 — รูปแบบจาก PDF</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dfe3e8;color:#17202a;font-family:Tahoma,Arial,sans-serif}
header{padding:14px 20px;background:#fff;border-bottom:1px solid #b6c0cb;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
h1{margin:0;font-size:17px;font-weight:500}nav{display:flex;gap:12px}a{color:#17507d}
label{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px}
select{font:inherit;padding:6px 9px;border:1px solid #9faab5;border-radius:4px;background:white;color:#17202a}
main{padding:22px;display:grid;gap:24px}.page-group{min-width:0;scroll-margin-top:14px}
h2{margin:0 0 8px;font-size:13px;font-weight:400}.page-scroll{overflow:auto;padding:2px 2px 6px}
.paper{position:relative;width:100%;aspect-ratio:22/17;background:white;box-shadow:0 1px 6px #0003}
.paper img,.paper canvas{display:block;width:100%;height:auto;aspect-ratio:22/17}
.paper canvas{position:absolute;inset:0}.paper canvas[hidden]{display:none}
.paper img.rendered{visibility:hidden}
@media(max-width:600px){main{padding:10px}header{padding:12px;gap:12px}label{margin-left:0}}
@page{size:279.4mm 215.9mm;margin:0}
@media print{header,h2{display:none}body{background:white}main{display:block;padding:0}.page-group{break-after:page}.page-group:last-child{break-after:auto}.page-scroll{overflow:visible;padding:0}.paper{width:279.4mm!important;height:215.9mm!important;box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header><h1>BU2-DE-26106</h1><nav aria-label="เลือกหน้า"><a href="#page1">หน้า 1</a><a href="#page2">หน้า 2</a></nav>
<label for="zoom">ขนาดแสดงผล<select id="zoom"><option value="fit">พอดีความกว้าง</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label></header>
<main>
<section id="page1" class="page-group"><h2>หน้า 1 / 2</h2><div class="page-scroll"><div class="paper"><img src="__PAGE1_IMAGE__" alt="ใบขอราคา BU2-DE-26106 หน้า 1 ตาม PDF ต้นฉบับ" width="2376" height="1836"><canvas hidden aria-label="หน้า PDF 1"></canvas></div></div></section>
<section id="page2" class="page-group"><h2>หน้า 2 / 2</h2><div class="page-scroll"><div class="paper"><img src="__PAGE2_IMAGE__" alt="ใบขอราคา BU2-DE-26106 หน้า 2 ตาม PDF ต้นฉบับ" width="2376" height="1836"><canvas hidden aria-label="หน้า PDF 2"></canvas></div></div></section>
</main>
<script type="application/json" id="pdf-assets">__ASSET_JSON__</script>
<script type="module">
const assets=JSON.parse(document.getElementById('pdf-assets').textContent);
const papers=[...document.querySelectorAll('.paper')];
const zoom=document.getElementById('zoom');
const bytes=value=>Uint8Array.from(atob(value),char=>char.charCodeAt(0));
let pdf=null,revision=0,timer=null;
const jobs=new Map();
function sizing(){
  for(const paper of papers){paper.style.width=zoom.value==='fit'?'100%':`${1056*Number(zoom.value)}px`;}
}
async function renderPages(){
  if(!pdf)return;
  const current=++revision;
  for(let index=0;index<papers.length;index++){
    if(current!==revision)return;
    const paper=papers[index],canvas=paper.querySelector('canvas'),image=paper.querySelector('img');
    const old=jobs.get(canvas);if(old){old.cancel();try{await old.promise}catch{}}
    if(current!==revision)return;
    const page=await pdf.getPage(index+1);
    const viewport=page.getViewport({scale:paper.clientWidth/792*Math.min(devicePixelRatio||1,3)});
    canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
    const task=page.render({canvasContext:canvas.getContext('2d'),viewport});jobs.set(canvas,task);
    try{await task.promise;if(current===revision){canvas.hidden=false;image.classList.add('rendered');}}
    catch(error){if(error.name!=='RenderingCancelledException')console.error(error)}
    finally{if(jobs.get(canvas)===task)jobs.delete(canvas);}
  }
}
zoom.addEventListener('change',()=>{sizing();renderPages();});
window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(()=>{if(zoom.value==='fit')renderPages();},180);});
sizing();
try{
  const moduleUrl=URL.createObjectURL(new Blob([bytes(assets.module)],{type:'text/javascript'}));
  const workerUrl=URL.createObjectURL(new Blob([bytes(assets.worker)],{type:'text/javascript'}));
  const pdfjs=await import(moduleUrl);pdfjs.GlobalWorkerOptions.workerSrc=workerUrl;
  pdf=await pdfjs.getDocument({data:bytes(assets.pdf),isEvalSupported:false,useWorkerFetch:false}).promise;
  await renderPages();
}catch(error){console.error('PDF rendering unavailable; showing embedded page images.',error);}
</script>
</body>
</html>
