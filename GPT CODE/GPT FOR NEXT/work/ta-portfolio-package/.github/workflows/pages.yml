name: Publish TA Portfolio

on:
  push:
    branches: [main]
    paths:
      - "publish/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check public files only
        shell: bash
        run: |
          set -euo pipefail
          test -d publish
          test -z "$(find publish -type l -print)"
          expected=$(printf '%s\n' 'css/login.css' 'index.html' 'js/encrypted-portfolio.js' 'js/login.js' | sort)
          actual=$(find publish -type f -printf '%P\n' | sort)
          test "$actual" = "$expected"
          node --check publish/js/login.js
          node --check publish/js/encrypted-portfolio.js
          mkdir _site
          cp -R publish/. _site/
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

